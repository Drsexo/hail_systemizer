name: Build and Release

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for new Hail commit
        id: check
        env:
          HAIL_TOKEN: ${{ secrets.HAIL_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          HAIL_SHA=$(curl -fsSL \
            -H "Authorization: Bearer ${HAIL_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/aistra0528/Hail/actions/workflows/android.yml/runs?branch=main&status=success&per_page=1" \
            | jq -r '.workflow_runs[0].head_sha')
          SHORT_SHA="${HAIL_SHA:0:7}"
          echo "Latest Hail commit: ${SHORT_SHA}"

          LATEST_TAG=$(curl -fsSL \
            -H "Authorization: Bearer ${HAIL_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" 2>/dev/null \
            | jq -r '.tag_name // ""')
          echo "Latest release tag: ${LATEST_TAG:-none}"

          if echo "$LATEST_TAG" | grep -q "$SHORT_SHA"; then
            echo "Hail commit ${SHORT_SHA} already released. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build module
        if: steps.check.outputs.should_build == 'true'
        id: build
        env:
          HAIL_TOKEN: ${{ secrets.HAIL_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/build_module.sh

      - name: Commit rendered metadata
        if: steps.check.outputs.should_build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module/update.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No metadata changes to commit"
            exit 0
          fi
          git commit -m "chore: bump to ${{ steps.build.outputs.version }}"
          git push

      - name: Upload release asset
        if: steps.check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.build.outputs.release_tag }}
          name: ${{ steps.build.outputs.release_title }}
          body: ${{ steps.build.outputs.release_body }}
          files: ${{ steps.build.outputs.zip_path }}
          prerelease: false
          generate_release_notes: false

      - name: Prune releases older than 6 months
        if: steps.check.outputs.should_build == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cutoff=$(date -u -d '6 months ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Pruning releases published before $cutoff"
          gh release list --repo "${{ github.repository }}" --json tagName,publishedAt \
            --jq ".[] | select(.publishedAt < \"$cutoff\") | .tagName" \
            | while read -r tag; do
                echo "Deleting release $tag"
                gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
              done